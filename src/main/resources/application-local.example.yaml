server:
  port: 18081
spring:
  application:
    name: hmdp
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/hmdp?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8
    username: "${HMDP_DB_USERNAME:root}"
    password: "${HMDP_DB_PASSWORD:}"
  redis:
    host: 127.0.0.1
    port: 6381
    # 本机 Redis 未设置 requirepass，无需密码；若你的 Redis 有密码请取消注释并填入
    # password:
    lettuce:
      pool:
        max-active: 10
        max-idle: 10
        min-idle: 1
        time-between-eviction-runs: 10s
    database: 6
  jackson:
    default-property-inclusion: non_null # JSON处理时忽略非空字段
  rabbitmq:
    host: "127.0.0.1"
    username: "${HMDP_MQ_USERNAME:}"
    password: "${HMDP_MQ_PASSWORD:}"
    virtual-host: "/dianping-local"
    port: 5672
    listener:
      simple:
        concurrency: 1
        max-concurrency: 2
        prefetch: 1
        auto-startup: true
        default-requeue-rejected: true
    template:
      retry:
        enabled: true
        initial-interval: 1000ms
        max-attempts: 3
        max-interval: 10000ms
        multiplier: 1
mybatis-plus:
  type-aliases-package: com.hmdp.entity # 别名扫描包
logging:
  level:
    com.hmdp: debug